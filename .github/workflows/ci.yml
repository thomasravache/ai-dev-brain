# CI das skills (SPEC-0001): lint, testes de arquitetura (ADR-0001, ADR-0007) e suítes completas.
# SPEC-0001:IT-01 — verde num PR sem problemas. SPEC-0001:IT-02 — vermelho com erro de lint ou teste falhando.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio: o job só lê o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Fixo em 24.04: o Python 3.9 não tem build para 26.04 em actions/python-versions (verificado em 2026-10-14).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Mínimo suportado (ADR-0001) e a versão estável mais recente (verificada em 2026-10-14).
        python: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Histórico completo: a checagem da versão do plugin compara com origin/main (SPEC-0056).
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Lint (ADR-0003)
        if: matrix.python == '3.15'
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.0
          ruff check

      - name: Testes de arquitetura e suíte completa
        run: python -m unittest discover -s skills/gluon-spec/tests -v

      # Suíte da photon-brain, com os testes de arquitetura do ADR-0007 (SPEC-0017).
      - name: Testes da photon-brain
        run: python -m unittest discover -s skills/photon-brain/tests -v

      # Suíte da boson-atlas, com os testes de arquitetura do ADR-0010 (SPEC-0032).
      - name: Testes da boson-atlas
        run: python -m unittest discover -s skills/boson-atlas/tests -v

      # Servidor MCP fermion com as tools atlas e testes de arquitetura do ADR-0017 (SPEC-0054).
      - name: Testes do servidor MCP
        run: python -m unittest discover -s mcp/tests -v

      # Plugin fermion e marketplace fermion-lab (ADR-0016, SPEC-0053) e nomes das skills (ADR-0018, SPEC-0055).
      # O E2E-01 é pulado aqui (sem o Claude Code no runner) e roda local no G4 e no G5.
      - name: Testes do plugin e dos nomes das skills
        run: python -m unittest discover -s tests/plugin -v

      # Um PR que muda skills/** sobe a versão do plugin.json, senão `claude plugin update` não traz a mudança (SPEC-0056).
      - name: Versão do plugin sobe com as skills
        if: github.event_name == 'pull_request'
        run: python3 tests/plugin/check_plugin_version.py --base origin/main
